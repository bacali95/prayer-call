name: Setup backend
description: Install Python, restore the pip cache and install backend runtime and dev dependencies

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"
        cache: pip
        cache-dependency-path: requirements*.txt

    # requirements-dev.txt includes requirements.txt via `-r`.
    - name: Install dependencies
      shell: bash
      run: pip install -r requirements-dev.txt

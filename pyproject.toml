[project]
name = "prayer-call"
version = "2.0.0"
description = "Adhan scheduler that plays on Chromecast devices"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", ".venv", "static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
  "ignore:codecs.open.*:DeprecationWarning",
]
